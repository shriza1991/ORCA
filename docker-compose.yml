services:
  # ============================================================================
  # PostgreSQL + PostGIS Database Service
  # ============================================================================
  db:
    image: postgis/postgis:16-3.4
    container_name: orca_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-orca_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca_user} -d ${POSTGRES_DB:-orca_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

