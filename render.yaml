# =============================================================================
# ORCA — Render Blueprint Specification (render.yaml)
# Production deployment for ORCA backend API service and managed PostgreSQL
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # ORCA FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: orca-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATA_MODE
        value: DEMO
      - key: LLM_PROVIDER
        value: auto
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: "8000"
      # Paste .env.render.local in the existing Render service environment.
      # Neon pooled URL for runtime; direct URL for Alembic migrations.
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: COMMUNITY_HASH_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: NEON_UPLOADS_BUCKET
        value: uploads
      - key: FRONTEND_ORIGIN
        value: https://orca-qxx1.vercel.app
      - key: CORS_ORIGINS
        value: https://orca-qxx1.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: INCOIS_API_KEY
        sync: false
      - key: IMD_API_KEY
        sync: false

# Legacy Render database remains untouched outside this blueprint during cutover.
