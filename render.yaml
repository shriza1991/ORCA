# =============================================================================
# ORCA — Render Blueprint Specification (render.yaml)
# Production deployment for ORCA backend API service and managed PostgreSQL
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # ORCA FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: orca-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATA_MODE
        value: HYBRID
      - key: LLM_PROVIDER
        value: auto
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: orca-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://samudra-qxx1.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: INCOIS_API_KEY
        sync: false
      - key: IMD_API_KEY
        sync: false

databases:
  # ---------------------------------------------------------------------------
  # Managed PostgreSQL Database for ORCA persistence and audit trails
  # ---------------------------------------------------------------------------
  - name: orca-postgres
    plan: starter
    region: oregon
    databaseName: orca_db
    user: orca_user
    postgresMajorVersion: 16
